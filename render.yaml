databases:
  - name: job-portal-db
    databaseName: job_portal
    user: job_portal
    plan: basic-256mb

services:
  - type: web
    name: dynamic-job-portal-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python backend/manage.py collectstatic --noinput
    preDeployCommand: python backend/manage.py migrate
    startCommand: gunicorn --chdir backend backend.wsgi:application --bind 0.0.0.0:$PORT --access-logfile - --error-logfile - --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: job-portal-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: dynamic-job-portal-with-ai-and.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://dynamic-job-portal-with-ai-and-auto.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://dynamic-job-portal-with-ai-and-auto.vercel.app,https://dynamic-job-portal-with-ai-and.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
